# yantra base tmux config — status bar and pane styling
# Loaded via: tmux source-file "${YANTRA_HOME}/contexts/_base/tmux.status.conf"

set-option -g status on
set-option -g status-interval 2
set-option -g status-position bottom

set-option -g status-left-length 60
set-option -g status-right-length 80

# Instance identity on left (color comes from YANTRA_INSTANCE_BG env var)
set-option -g status-left " #[bold]#{E:YANTRA_INSTANCE}#[nobold] | #{E:YANTRA_LABEL} "
set-option -g status-style "bg=#{E:YANTRA_INSTANCE_BG},fg=#{E:YANTRA_INSTANCE_FG}"
set-option -g status-left-style "bg=#{E:YANTRA_INSTANCE_BG},fg=#{E:YANTRA_INSTANCE_FG},bold"

# Service health + time on right
set-option -g status-right " #{E:YANTRA_STATUS_LINE}  %H:%M "
set-option -g status-right-style "bg=#{E:YANTRA_INSTANCE_BG},fg=#{E:YANTRA_INSTANCE_FG}"

# Window list styling
set-option -g window-status-current-style "bg=#{E:YANTRA_INSTANCE_FG},fg=#{E:YANTRA_INSTANCE_BG},bold"
set-option -g window-status-style "bg=#{E:YANTRA_INSTANCE_BG},fg=#{E:YANTRA_INSTANCE_FG}"
set-option -g window-status-format " #{window_index}:#{window_name} "
set-option -g window-status-current-format " #{window_index}:#{window_name} "

# Pane borders — show pane title
set-option -g pane-border-status top
set-option -g pane-border-format " #[bold]#{pane_title}#[nobold] "
set-option -g pane-border-style "fg=#{E:YANTRA_INSTANCE_BG}"
set-option -g pane-active-border-style "fg=#{E:YANTRA_INSTANCE_FG}"

# General
set-option -g default-terminal "screen-256color"
set-option -g history-limit 50000
set-option -g mouse on
set-option -g base-index 1
set-option -g pane-base-index 1
